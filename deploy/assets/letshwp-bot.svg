<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#1A3FB8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD08A"/>
      <stop offset="1" stop-color="#14A866"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1E66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 배경(Mattermost 는 원형으로 잘라 보여 주므로 꽉 채운다) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="120" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="80" cy="440" r="140" fill="#FFFFFF" opacity="0.05"/>

  <!-- 문서 -->
  <g filter="url(#shadow)">
    <path d="M150 112 h158 l58 58 v220 a18 18 0 0 1 -18 18 h-198 a18 18 0 0 1 -18 -18 v-260 a18 18 0 0 1 18 -18 z" fill="#FFFFFF"/>
    <path d="M308 112 v40 a18 18 0 0 0 18 18 h40 z" fill="#C9D6FF"/>
  </g>

  <!-- 한글 글자 + HWPX 표시 -->
  <text x="252" y="292" text-anchor="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"
        font-weight="800" font-size="150" fill="#1A3FB8">한</text>
  <rect x="190" y="322" width="124" height="34" rx="17" fill="#E6ECFF"/>
  <text x="252" y="346" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="700" font-size="21" letter-spacing="3" fill="#2F6BFF">HWPX</text>

  <!-- 검증 통과 배지 -->
  <g filter="url(#shadow)">
    <circle cx="368" cy="380" r="54" fill="url(#badge)"/>
  </g>
  <circle cx="368" cy="380" r="54" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M344 381 l17 17 l32 -34" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 반짝임(서식 자동 정리) -->
  <path d="M118 150 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 z" fill="#FFFFFF"/>
  <path d="M392 216 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#FFFFFF" opacity="0.85"/>
</svg>
